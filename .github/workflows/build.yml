name: Build and portable checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runelite-version: ['1.13.2', 'latest.release']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test and package
        run: bash ./gradlew --no-daemon check build -PruneliteVersion=${{ matrix.runelite-version }}
